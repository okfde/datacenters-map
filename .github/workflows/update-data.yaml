name: Update datacenter data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: pnpm build:data

      - name: Detect meaningful changes
        id: detect
        run: |
          set -euo pipefail
          geojson="public/data/datacenters.geojson"
          csv="public/data/datacenters.csv"

          if git diff --quiet -- "$csv"; then
            csv_changed=false
          else
            csv_changed=true
          fi

          geojson_changed=false
          if ! git diff --quiet -- "$geojson"; then
            if ! git show HEAD:"$geojson" >/tmp/old.geojson 2>/dev/null; then
              geojson_changed=true
            else
              jq 'del(.fetched_at)' /tmp/old.geojson > /tmp/old.normalized.json
              jq 'del(.fetched_at)' "$geojson" > /tmp/new.normalized.json
              if ! cmp -s /tmp/old.normalized.json /tmp/new.normalized.json; then
                geojson_changed=true
              fi
            fi
          fi

          if [ "$csv_changed" = true ] || [ "$geojson_changed" = true ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful data changes detected."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful data changes (ignoring fetched_at)."
            git checkout -- "$geojson" "$csv" || true
          fi

      - name: Commit and push
        id: commit
        if: steps.detect.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/datacenters.geojson public/data/datacenters.csv
          git commit -m "🗃️ Update datacenter export from DC database"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yaml
    with:
      checkout_ref: ${{ needs.update.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
